name: Release

# 打 v* 标签时发布两个产物，并挂到同名 GitHub Release：
#   · 小体积启动器（约 4 MB）：不含运行时；机器上没有 .NET 桌面运行时时会先帮用户装好再启动
#   · 自包含完整版（约 67 MB）：运行时都在 exe 里，离线/内网可用
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    name: 发布（启动器 + 自包含完整版 / win-x64）
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 启动器用 NativeAOT 编译，需要 MSVC 工具链；windows-latest 自带 VS 2022 + C++ 工作负载。
      # 自包含完整版同时产出，供不能联网装运行时的机器使用。
      - name: 发布（启动器 + 自包含完整版）
        shell: pwsh
        run: ./tools/publish.ps1 -All -OutputDir artifacts/publish

      - name: 生成发布说明
        shell: pwsh
        run: |
          # 产物文件名都带版本号（版本读自 exe 自身的版本资源）：
          #   启动器   SeriTerm-<版本>-<RID>.exe
          #   完整版   SeriTerm-<版本>-<RID>-full.exe
          $boot = Get-ChildItem artifacts/publish/SeriTerm-*-win-x64.exe | Select-Object -First 1
          $full = Get-ChildItem artifacts/publish/SeriTerm-*-win-x64-full.exe | Select-Object -First 1
          if (-not $boot) { throw '发布产物里没有启动器（SeriTerm-<版本>-<RID>.exe）' }
          if (-not $full) { throw '发布产物里没有自包含完整版（SeriTerm-<版本>-<RID>-full.exe）' }

          # 标签与产物版本必须一致，否则下载下来的文件名会撒谎。不一致时改 Directory.Build.props 的 <Version>。
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          foreach ($exe in @($boot, $full)) {
            if (-not $exe.Name.StartsWith("SeriTerm-$version-", [StringComparison]::Ordinal)) {
              throw "标签 $tag 与产物版本对不上：产物是 $($exe.Name)。请先把 Directory.Build.props 的 <Version> 改成 $version 再打标签。"
            }
          }

          # 发布说明正文直接取自 CHANGELOG.md 里本版本那一节：
          # 版本变更属于"人写的文档"，不该靠工作流从提交记录里猜；缺这一节就失败，宁可不发。
          # 这一节要精简（用户视角、10 行以内）——写法要求写在 CHANGELOG.md 开头，
          # 测量表格/采样数字/探针断言/测试数字留在 docs/verification.md，别搬进发布说明。
          $lines = Get-Content CHANGELOG.md
          $start = (0..($lines.Count - 1) | Where-Object { $lines[$_] -match "^## v$([regex]::Escape($version))(\s|$)" } |
            Select-Object -First 1)
          if ($null -eq $start) { throw "CHANGELOG.md 里没有 $tag 这一节，请先补好再打标签。" }

          $next = (0..($lines.Count - 1) | Where-Object { $_ -gt $start -and $lines[$_] -match '^## v' } |
            Select-Object -First 1)
          $end = if ($null -ne $next) { $next - 1 } else { $lines.Count - 1 }
          $body = (($lines[$start..$end]) -join "`n").Trim()
          if (-not $body) { throw "CHANGELOG.md 的 $tag 一节是空的。" }

          $bootMb = [math]::Round($boot.Length / 1MB, 2)
          $fullMb = [math]::Round($full.Length / 1MB, 1)
          $bootHash = (Get-FileHash $boot.FullName -Algorithm SHA256).Hash
          $fullHash = (Get-FileHash $full.FullName -Algorithm SHA256).Hash

          $notes = @"
          $body

          ---

          ### 下载

          两个产物功能完全一样，按你的情况选一个即可。文件名里的 $version 就是程序内显示的版本号。

          **1. ``$($boot.Name)`` —— 推荐，$bootMb MB**

          - 大小：$($boot.Length) 字节（$bootMb MB）
          - SHA256：``$bootHash``
          - 本身不含 .NET 运行时，因此在没装运行时的机器上也能双击运行：
            启动时会检查 .NET 8 桌面运行时，已装就直接启动；没装会先问一句，
            同意后从微软官方站点下载官方安装包（校验数字签名）并安装，装完自动继续启动。
          - 已经装过 .NET 8/9/10 桌面运行时的机器，只下载这 $bootMb MB；
            没有任何 .NET 的机器需要额外下载约 56 MB 的官方运行时安装包（装一次，之后所有 .NET 程序共用）。

          **2. ``$($full.Name)`` —— 离线/内网用，$fullMb MB**

          - 大小：$($full.Length) 字节（$fullMb MB）
          - SHA256：``$fullHash``
          - 运行时整套打包在 exe 里，不联网、不装任何东西，下载后直接双击运行。
            首次启动需要自解压到临时目录，会比常规安装版稍慢一点。

          ### 系统要求

          - Windows 10 1809 或更高 / Windows 11（64 位）

          ### 文档

          - [README](https://github.com/$env:GITHUB_REPOSITORY#readme)：功能说明与已知边界
          - [开发规格与里程碑](https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/development-plan.md)：每条设计取舍的原因
          - [验证记录](https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/verification.md)：所有数字的实测证据
          - [更新日志](https://github.com/$env:GITHUB_REPOSITORY/blob/main/CHANGELOG.md)

          ### 许可

          MIT License。运行时依赖 CommunityToolkit.Mvvm、Microsoft.Extensions.*、System.IO.Ports、
          System.Management，均为 MIT 许可。
          "@

          Set-Content -Path release-notes.md -Encoding utf8NoBOM -Value $notes
          Get-Content release-notes.md | Select-Object -First 12

      - name: 创建 Release 并上传产物
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $boot = Get-ChildItem artifacts/publish/SeriTerm-*-win-x64.exe | Select-Object -First 1
          $full = Get-ChildItem artifacts/publish/SeriTerm-*-win-x64-full.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $boot.FullName $full.FullName --title "SeriTerm $env:GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
