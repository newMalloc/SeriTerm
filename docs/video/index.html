<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeriTerm 1.2.3 · 界面演示</title>
<link rel="icon" href="../images/seriterm.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    overflow: hidden;
    background: #090d17;
    color: #f4f6fd;
    font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  }
  #stage {
    position: absolute;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: top left;
    background:
      radial-gradient(ellipse at 84% 16%, #2b204f 0%, transparent 57%),
      radial-gradient(ellipse at 35% 100%, #172f48 0%, transparent 58%),
      #101522;
  }
  .bar {
    position: absolute;
    inset: 0 84px auto;
    top: 30px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ffffff26;
  }
  .identity { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; }
  .identity img { width: 50px; height: 50px; }
  .version { color: #ccd9f8; font: 21px Consolas, monospace; }
  #story { position: absolute; left: 84px; top: 258px; width: 450px; }
  #section { margin: 0 0 20px; color: #87c9ff; font-size: 25px; letter-spacing: .11em; }
  #headline {
    margin: 0 0 27px;
    font-size: 70px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -.047em;
    white-space: pre-line;
  }
  #story.hero #headline { font-size: 82px; }
  #detail { margin: 0; color: #c1cbe0; font-size: 27px; line-height: 1.55; white-space: pre-line; }
  #action { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 28px; }
  kbd, .download {
    color: #e8f1ff;
    border: 1px solid #687d9d;
    border-radius: 7px;
    background: #1f304b;
    padding: 7px 12px;
    font: 21px Consolas, monospace;
  }
  .download {
    border: 0;
    background: #9ed3ff;
    color: #142943;
    font: 650 23px "Segoe UI", "Microsoft YaHei UI", sans-serif;
    text-decoration: none;
    padding: 11px 20px;
  }
  #demo {
    position: absolute;
    top: 136px;
    left: 540px;
    width: 1296px;
    height: 806px;
    isolation: isolate;
    border-radius: 14px;
    overflow: hidden;
    outline: 1px solid #ffffff42;
    box-shadow: 0 32px 92px #04060d99;
    background: #10141e;
  }
  #demo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #marker {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid #bbe3ff;
    border-radius: 50%;
    box-shadow: 0 0 0 6px #4fa6ff48, inset 0 0 12px #15284240;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .footer {
    position: absolute;
    inset: auto 84px 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #b2c0d9;
    font-size: 20px;
  }
  #phase-line { position: absolute; left: 84px; right: 84px; bottom: 28px; height: 2px; background: #ffffff27; }
  #phase-line i { display: block; width: 100%; height: 100%; transform-origin: left; background: #81c8ff; }
  #controls {
    position: absolute;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: .7rem;
    width: min(420px, calc(100% - 32px));
    padding: 6px 10px;
    border: 1px solid #556887;
    border-radius: 9px;
    background: #121a2beb;
    font: 14px "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  #controls[hidden] { display: none; }
  #controls button {
    background: #273850;
    border: 0;
    border-radius: 5px;
    color: inherit;
    padding: 5px 10px;
    cursor: pointer;
  }
  #controls input { min-width: 0; flex: 1; accent-color: #86caff; }
  :focus-visible { outline: 2px solid #9ed3ff; outline-offset: 3px; }
</style>
</head>
<body>
<main id="stage" aria-label="SeriTerm 1.2.3 界面演示">
  <header class="bar">
    <div class="identity"><img src="../images/seriterm.png" alt="">SeriTerm</div>
    <div class="version">v1.2.3 &nbsp;·&nbsp; Windows</div>
  </header>
  <div id="story">
    <p id="section"></p>
    <h1 id="headline"></h1>
    <p id="detail"></p>
    <div id="action"></div>
  </div>
  <div id="demo">
    <img id="view" alt="SeriTerm 1.2.3 工作台">
    <img id="previous" alt="" aria-hidden="true">
    <span id="marker" aria-hidden="true"></span>
  </div>
  <div class="footer">
    <span>SeriTerm 界面演示 · 模拟串口数据</span>
    <span>github.com/newMalloc/SeriTerm</span>
  </div>
  <div id="phase-line" aria-hidden="true"><i></i></div>
</main>
<div id="controls" hidden>
  <button id="toggle" type="button">暂停</button>
  <input id="progress" type="range" min="0" max="34" step=".05" value="0" aria-label="播放进度">
  <output id="time">0:00 / 0:34</output>
</div>
<script>
  const duration = 34;
  const artwork = {
    dark: '../images/workspace-dark.png',
    light: '../images/workspace-light.png',
    searchOpen: 'shots/search-open.webp',
    searchType: 'shots/search-type.webp',
    searchMatch: 'shots/search-match.webp',
    searchNext: 'shots/search-next.webp',
    paused: 'shots/display-paused.webp',
    resumed: 'shots/display-resumed.webp',
    settings: 'shots/settings.webp',
    appearance: 'shots/appearance.webp',
    glassDark: 'shots/glass-dark.webp',
    glassAdjusted: 'shots/glass-adjusted.webp',
    glassLight: 'shots/glass-light.webp',
  };
  const release = 'https://github.com/newMalloc/SeriTerm/releases/tag/v1.2.3';
  const scenes = [
    {
      at: 0, label: 'Windows 串口工作台', title: '串口调试\n一屏完成',
      detail: '连接、收发和记录，\n都在一个工作台里。', frames: [[0, 'dark']],
    },
    {
      at: 5, label: '接收与查找', title: '快速定位\n异常日志',
      detail: '查找浮在右上角，\n保留接收区的完整高度。', keys: ['Ctrl', 'F'],
      frames: [[0, 'dark'], [.8, 'searchOpen', 66, 362], [1.48, 'searchType'],
        [1.82, 'searchMatch'], [4.3, 'searchNext', 1050, 111]],
    },
    {
      at: 12, label: '暂停与继续', title: '暂停显示\n继续接收',
      detail: '暂停时仍然接收数据，\n恢复后补齐这段日志。', keys: ['F6'],
      frames: [[0, 'dark'], [1, 'paused', 266, 259], [4.1, 'resumed', 266, 259]],
    },
    {
      at: 18, label: '个性化', title: '磨砂玻璃\n深浅随心',
      detail: '即时预览透明度和模糊程度。\n深色、浅色都能用。', keys: ['Ctrl', ','],
      frames: [[0, 'dark'], [.7, 'settings', 943, 21], [2.05, 'appearance', 1034, 441],
        [2.75, 'glassDark', 917, 222], [5.1, 'glassAdjusted', 963, 259],
        [8, 'glassLight', 914, 140]],
    },
    {
      at: 29, label: '免费开源 · MIT', title: '开始使用\nSeriTerm',
      detail: 'Windows 10 / 11 · x64\n下载后双击运行。', download: true,
      frames: [[0, 'light']],
    },
  ];

  const byId = id => document.getElementById(id);
  const stage = byId('stage');
  const story = byId('story');
  const demo = byId('demo');
  const view = byId('view');
  const prior = byId('previous');
  const marker = byId('marker');
  const fill = document.querySelector('#phase-line i');
  const controls = byId('controls');
  const toggle = byId('toggle');
  const progress = byId('progress');
  const params = new URLSearchParams(location.search);
  const frozen = params.has('static') || params.has('t');
  let playing = !frozen && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let time = 0;
  let lastTick;
  let currentScene;

  function layout() {
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
    stage.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
    stage.style.transform = 'scale(' + scale + ')';
  }

  function showCaption(scene) {
    if (scene === currentScene) return;
    currentScene = scene;
    story.classList.toggle('hero', scene.at === 0);
    byId('section').textContent = scene.label;
    byId('headline').textContent = scene.title;
    byId('detail').textContent = scene.detail;
    const action = byId('action');
    action.replaceChildren();
    for (const key of scene.keys ?? []) {
      const badge = document.createElement('kbd');
      badge.textContent = key;
      action.append(badge);
    }
    if (scene.download) {
      const button = document.createElement('a');
      button.className = 'download';
      button.href = release;
      button.textContent = '下载 v1.2.3';
      action.append(button);
    }
  }

  function draw(value) {
    time = Math.max(0, Math.min(duration, value || 0));
    const scene = scenes.findLast(item => item.at <= time);
    const elapsed = time - scene.at;
    const i = scene.frames.findLastIndex(frame => frame[0] <= elapsed);
    const [start, shot, x, y] = scene.frames[i];
    const since = elapsed - start;
    const reveal = 1 - Math.pow(1 - Math.min(1, elapsed / .52), 3);
    const fade = shot === 'glassLight' ? .32 : .16;
    const previousOpacity = i > 0 ? Math.max(0, 1 - since / fade) : 0;
    showCaption(scene);
    if (view.getAttribute('src') !== artwork[shot]) view.src = artwork[shot];
    if (previousOpacity > 0) {
      const earlier = artwork[scene.frames[i - 1][1]];
      if (prior.getAttribute('src') !== earlier) prior.src = earlier;
    }
    prior.style.opacity = previousOpacity;
    marker.style.opacity = x === undefined || since > .72 ? 0 : 1 - Math.max(0, since - .36) / .36;
    if (x !== undefined) {
      marker.style.left = x / 1110 * 100 + '%';
      marker.style.top = y / 690 * 100 + '%';
      marker.style.scale = 1 + Math.min(.72, since) * .36;
    }
    story.style.transform = 'translateY(' + (1 - reveal) * 12 + 'px)';
    story.style.opacity = .42 + .58 * reveal;
    const intro = scene.at === 0 ? Math.pow(Math.max(0, 1 - elapsed / 1.15), 3) : 0;
    demo.style.transform = 'translateY(' + intro * 20 + 'px) scale(' + (1 - intro * .025) + ')';
    fill.style.transform = 'scaleX(' + time / duration + ')';
    progress.value = time;
    byId('time').value = '0:' + String(Math.floor(time)).padStart(2, '0') + ' / 0:34';
    toggle.textContent = playing ? '暂停' : time >= duration ? '重播' : '播放';
  }

  function tick(now) {
    if (playing && lastTick !== undefined) {
      const next = Math.min(duration, time + (now - lastTick) / 1000);
      if (next === duration) playing = false;
      draw(next);
    }
    lastTick = now;
    requestAnimationFrame(tick);
  }

  toggle.addEventListener('click', () => {
    playing = !playing;
    lastTick = undefined;
    draw(playing && time >= duration ? 0 : time);
  });
  progress.addEventListener('input', () => {
    playing = false;
    draw(Number(progress.value));
  });
  addEventListener('resize', layout);
  layout();
  window.seek = ms => draw(ms / 1000);
  Promise.all(Object.values(artwork).map(src => {
    const img = new Image();
    img.src = src;
    return img.decode();
  })).then(() => {
    draw(Number(params.get('t')));
    controls.hidden = frozen;
    window.__ready = true;
    if (!frozen) requestAnimationFrame(tick);
  });
</script>
</body>
</html>
